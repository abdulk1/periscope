apiVersion: v1
kind: ConfigMap
metadata:
  creationTimestamp: 2026-05-11T08:02:19Z
  name: envoy
  namespace: payments
data:
  nginx.conf: |-
    server {
      listen 80;
      location /healthz {
        return 200 "ok";
      }
    }
  entrypoint.sh: |
    #!/bin/sh
    set -eu

    exec /usr/local/bin/envoy \
      -c /etc/envoy/envoy.yaml \
      --log-level "${LOG_LEVEL:-warn}"
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    MIIC0DCCAbigAwIBAgIUZ0Q9r3nRLZ3sB0kK1mVQnHhFqXwwDQYJKoZIhvcNAQEL
    BQAwDzENMAsGA1UEAwwEcm9vdDAeFw0yNjA1MTEwODAyMTlaFw0zNjA1MDgwODAy
    -----END CERTIFICATE-----
  indented-first-line: "    this file starts indented\nand the second line does not"
  trailing-blank-line: |+
    one
    two

  windows-line-endings: "first\r\nsecond\r\n"
  single-line: log_level = warn
