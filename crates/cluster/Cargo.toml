[package]
name = "periscope-cluster"
description = "Kubernetes clients, watchers and log streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
futures.workspace = true
jsonpath-rust.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
periscope-bridge.workspace = true
periscope-config.workspace = true
# `preserve_order` is what keeps the detail pane's YAML in the order the
# apiserver sent it rather than alphabetised. It arrives transitively today;
# asking for it here is what stops that becoming a silent reordering.
serde_json = { workspace = true, features = ["preserve_order"] }
serde-saphyr.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
