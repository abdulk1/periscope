[workspace]
resolver = "3"
members = ["crates/*", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Floor set by `kube` 4.2, which declares 1.89. See docs/DECISIONS.md ADR-0009.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/abdul/periscope"
authors = ["Periscope contributors"]

[workspace.dependencies]
# Internal crates.
periscope-bridge = { path = "crates/bridge", version = "0.1.0" }
periscope-cluster = { path = "crates/cluster", version = "0.1.0" }
periscope-config = { path = "crates/config", version = "0.1.0" }
periscope-store = { path = "crates/store", version = "0.1.0" }
periscope-ui = { path = "crates/ui", version = "0.1.0" }

# UI. Pinned to exact versions: GPUI is pre-1.0 and breaks freely between
# releases. See docs/DECISIONS.md ADR-0001 for why these are crates.io pins
# rather than the git SHA pin the original plan called for.
# `runtime_shaders` compiles the Metal shaders at startup instead of at build
# time, so building does not require Xcode's separately-downloaded Metal
# toolchain. See docs/DECISIONS.md ADR-0008.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"

# Kubernetes. `kube` pins `kube-client`/`kube-runtime`/`kube-core` internally, so
# one version here fixes all four. Exactly one `k8s-openapi` version feature may
# be enabled workspace-wide; see docs/DECISIONS.md ADR-0010.
kube = { version = "4.2", features = [
    "client",
    "runtime",
    "ws",
    "oidc",
    "oauth",
    "socks5",
    "http-proxy",
    "gzip",
] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }

# Async + plumbing.
flume = "0.12"
futures = "0.3"
tokio = { version = "1.53", default-features = false }

# Diagnostics.
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"

# Everything else.
# Settings live in TOML; edits are applied from YAML.
toml = "1.1"
serde-saphyr = "0.0.29"
# The same fuzzy matcher Zed uses, for the command palette.
nucleo-matcher = "0.3"
# Log filtering: substring is hand-rolled, patterns are not.
regex = "1.11"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The HTTP client for the opt-in update check, and only for that. This is the
# fork GPUI already pulls in: depending on upstream `reqwest` instead would put
# a second HTTP stack, hyper and TLS chain into the tree for one GET a session.
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = [
    "charset",
    "http2",
    "rustls-tls-native-roots",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev]
# GPUI and its graphics dependencies are unusably slow in debug builds.
codegen-units = 16

[profile.dev.package]
gpui = { opt-level = 3 }
gpui-component = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
ropey = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
