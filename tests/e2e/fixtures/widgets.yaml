# A custom resource definition of our own, so the CRD tests do not depend on
# anything a real operator installs. `discovery.rs` asserts that
# `widgets.example.com` is discovered, marked custom, and lists through exactly
# the same path pods do.
#
# This lived only in the author's cluster until CI ran the suite for the first
# time and could not find it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
---
apiVersion: example.com/v1
kind: Widget
metadata:
  name: sprocket
  namespace: default
spec:
  size: 3
status:
  phase: Ready
