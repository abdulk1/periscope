# A custom resource definition of our own, so the CRD tests do not depend on
# anything a real operator installs. `discovery.rs` asserts that
# `widgets.example.com` is discovered, marked custom, and lists through exactly
# the same path pods do.
#
# This lived only in the author's cluster until CI ran the suite for the first
# time and could not find it.
#
# The CRD only. An instance of it cannot be applied in the same pass — the type
# does not exist until this has been established — so the test that needs one
# creates it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
