# A pod that answers on a port, for the port-forward tests.
apiVersion: apps/v1
kind: Deployment
metadata: { name: webby, namespace: default, labels: { app: webby } }
spec:
  replicas: 1
  selector: { matchLabels: { app: webby } }
  template:
    metadata: { labels: { app: webby } }
    spec:
      containers:
        - name: httpd
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo 'periscope-forward-ok' > /www/index.html && httpd -f -p 8080 -h /www"]
          ports: [{ containerPort: 8080 }]
