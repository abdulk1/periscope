name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # GPUI links against the system graphics, font and input stacks.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libxcb-composite0-dev \
            mesa-vulkan-drivers \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build release binary
        run: cargo build --release --bin scope

  e2e:
    name: kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The e2e crate needs no display, but it does link the same graphics
      # dependencies through the workspace.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libxcb-composite0-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: periscope

      - name: Seed the load fixture
        run: cargo run --release -p periscope-e2e --bin seed-pods -- --count 10000

      # Without these, the log, port-forward and exec suites skip themselves and
      # CI passes with fifteen tests silently absent. `firehose` is deliberately
      # left out here: it saturates the CPU by design, and this runner has two
      # cores to share with every timing-sensitive test in the suite.
      - name: Install the workload fixtures
        run: |
          kubectl apply -f tests/e2e/fixtures/chatty.yaml
          kubectl apply -f tests/e2e/fixtures/webby.yaml
          kubectl wait --for=condition=Available --timeout=300s \
            deployment/chatty deployment/webby

      # PERISCOPE_E2E_REQUIRE_FIXTURES turns "the fixture is missing, skipping"
      # into a failure. Without it an apply that quietly did nothing would leave
      # the suite green and empty, which is the hole this whole section closes.
      - name: End-to-end tests
        env:
          PERISCOPE_E2E_REQUIRE_FIXTURES: "1"
        run: |
          cargo test --release -p periscope-e2e -- --ignored --test-threads 1 --nocapture \
            --skip a_firehose_is_ingested_at_rate_and_stays_bounded

      # The ingest-rate budget needs the unthrottled producer, so it runs on its
      # own after everything else — including the drain test, which evicts every
      # pod on the one node this cluster has.
      - name: Ingest-rate budget
        env:
          PERISCOPE_E2E_REQUIRE_FIXTURES: "1"
        run: |
          kubectl apply -f tests/e2e/fixtures/firehose.yaml
          kubectl wait --for=condition=Available --timeout=300s deployment/firehose
          cargo test --release -p periscope-e2e --test logs -- --ignored --nocapture \
            a_firehose_is_ingested_at_rate_and_stays_bounded
          kubectl delete -f tests/e2e/fixtures/firehose.yaml
