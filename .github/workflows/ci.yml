name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # GPUI links against the system graphics, font and input stacks.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libxcb-composite0-dev \
            mesa-vulkan-drivers \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build release binary
        run: cargo build --release --bin scope

  e2e:
    name: kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The e2e crate needs no display, but it does link the same graphics
      # dependencies through the workspace.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libxcb-composite0-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: periscope

      - name: Seed the load fixture
        run: cargo run --release -p periscope-e2e --bin seed-pods -- --count 10000

      - name: End-to-end tests
        run: cargo test --release -p periscope-e2e -- --ignored --test-threads 1 --nocapture
