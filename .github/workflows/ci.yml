name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      # GPUI links against the system graphics, font and input stacks.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libxcb-composite0-dev \
            mesa-vulkan-drivers \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build release binary
        run: cargo build --release --bin scope

  e2e:
    name: kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No apt step. The e2e crate opens no window, and since `periscope-bridge`
      # made the GPUI event pump an optional feature it no longer drags GPUI in
      # through the workspace either — so nothing here links a system library.
      # Installing the graphics -dev packages for it cost 225s a run.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: periscope

      # Applied before anything is compiled and waited for afterwards, so the
      # image pulls happen while cargo works. Waiting for them synchronously
      # here cost 200s of a runner doing nothing.
      #
      # The CRD tests exist to prove a cluster full of custom resources renders
      # like any other, so CI has to be one. cert-manager and Argo CD are the
      # two the suite names; `widgets` is our own, so the basic CRD path does
      # not depend on anyone else's release cadence.
      #
      # Without the workloads, the log, port-forward and exec suites skip
      # themselves and CI passes with fifteen tests silently absent. `firehose`
      # is deliberately left out: it saturates the CPU by design, and this
      # runner has two cores to share with every timing-sensitive test.
      - name: Start the fixtures pulling
        run: |
          kubectl apply -f tests/e2e/fixtures/widgets.yaml
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.2/manifests/install.yaml
          kubectl apply -f tests/e2e/fixtures/chatty.yaml
          kubectl apply -f tests/e2e/fixtures/webby.yaml
          kubectl apply -f tests/e2e/fixtures/sidecars.yaml

      # Both binaries are built here rather than on demand, so that the compile
      # and the image pulls above overlap instead of queueing.
      # `--profile e2e` is release with thin LTO and single-codegen-unit
      # linking turned off. Eleven test binaries linked that way was most of a
      # ten-minute build; relinking one dropped from 27.6s to 1.2s locally.
      - name: Build the suite
        run: |
          cargo build --profile e2e -p periscope-e2e --bin seed-pods
          cargo test --profile e2e -p periscope-e2e --no-run

      - name: Seed the load fixture
        run: |
          cargo run --profile e2e -p periscope-e2e --bin seed-pods -- --count 10000
          cargo run --profile e2e -p periscope-e2e --bin seed-pods -- --large-config-map

      # By now these have almost always finished pulling; the timeout is for the
      # times they have not.
      - name: Wait for the fixtures
        run: |
          kubectl wait --for=condition=Established --timeout=300s \
            crd/certificates.cert-manager.io \
            crd/applications.argoproj.io \
            crd/widgets.example.com
          kubectl wait --for=condition=Available --timeout=300s \
            deployment/chatty deployment/webby deployment/sidecars

      # PERISCOPE_E2E_REQUIRE_FIXTURES turns "the fixture is missing, skipping"
      # into a failure. Without it an apply that quietly did nothing would leave
      # the suite green and empty, which is the hole this whole section closes.
      - name: End-to-end tests
        env:
          PERISCOPE_E2E_REQUIRE_FIXTURES: "1"
        run: |
          cargo test --profile e2e -p periscope-e2e -- --ignored --test-threads 1 --nocapture \
            --skip a_firehose_is_ingested_at_rate_and_stays_bounded

      # The ingest-rate budget needs the unthrottled producer, so it runs on its
      # own after everything else — including the drain test, which evicts every
      # pod on the one node this cluster has.
      #
      # Its `kubectl wait` is the slowest thing left in this job, ~3 minutes for
      # four busybox pods, and that is a cost of the job getting faster rather
      # than a fault: the suite used to take ten minutes after seeding, which
      # gave the kubelet ten minutes to catch up with 10,000 new pods before
      # anything else asked it to schedule. It now takes under one. Applying
      # firehose earlier is not the fix — it saturates the CPU by design, which
      # is why it is down here away from every timing-sensitive test.
      - name: Ingest-rate budget
        env:
          PERISCOPE_E2E_REQUIRE_FIXTURES: "1"
          # Not the 10,000/s budget in IMPLEMENTATION.md §4. The firehose, the
          # apiserver and the test share two cores, and the fixture's whole job
          # is to saturate them — so this measures how much of the machine the
          # *producer* got. Unchanged code has measured 8,435, 20,635 and 59,434
          # here. The budget is asserted where it means something; this asks
          # only whether the pipe flows, and the real rate is printed either way.
          PERISCOPE_E2E_INGEST_BUDGET: "2000"
        run: |
          kubectl apply -f tests/e2e/fixtures/firehose.yaml
          kubectl wait --for=condition=Available --timeout=300s deployment/firehose
          cargo test --profile e2e -p periscope-e2e --test logs -- --ignored --nocapture \
            a_firehose_is_ingested_at_rate_and_stays_bounded
          kubectl delete -f tests/e2e/fixtures/firehose.yaml

  bundle:
    name: macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Unsigned: signing needs a Developer ID this repository does not have and
      # must never contain. The script picks credentials up from the environment
      # when they exist, so a release build is the same script with two more
      # variables set.
      - name: Build Periscope.app and the disk image
        run: packaging/macos/bundle.sh

      - name: Check the bundle is well-formed
        run: |
          plutil -lint target/bundle/Periscope.app/Contents/Info.plist
          test -x target/bundle/Periscope.app/Contents/MacOS/scope
          test -f target/bundle/Periscope.app/Contents/Resources/AppIcon.icns
          hdiutil verify target/bundle/Periscope.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: Periscope-macos-unsigned
          path: target/bundle/Periscope.dmg
          if-no-files-found: error

  linux-packages:
    name: deb and rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libxcb-composite0-dev \
            desktop-file-utils \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build the binary
        run: cargo build --release --bin scope

      - name: Package
        run: |
          cargo deb --no-build --package scope
          cargo generate-rpm -p crates/scope

      # Proving the packages contain what they claim: a binary, a desktop entry
      # and an icon, in the places a desktop expects to find them. `$auto` fills
      # Depends in from the binary's own NEEDED entries, which only works on a
      # real ELF build — this is the only place that is exercised.
      - name: Check the packages
        run: |
          deb="$(ls target/debian/*.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -q ' ./usr/bin/scope$'
          dpkg-deb --contents "$deb" | grep -q 'periscope.desktop$'
          dpkg-deb --field "$deb" Depends | grep -q .

          rpm="$(ls target/generate-rpm/*.rpm)"
          rpm -qlp "$rpm"
          rpm -qlp "$rpm" | grep -qx '/usr/bin/scope'

      - name: Install the deb and check it lands where it should
        run: |
          sudo dpkg --install "$(ls target/debian/*.deb)" || sudo apt-get -f install -y
          test -x /usr/bin/scope
          test -f /usr/share/applications/periscope.desktop
          desktop-file-validate /usr/share/applications/periscope.desktop
          sudo dpkg --remove periscope

      - uses: actions/upload-artifact@v7
        with:
          name: periscope-linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  windows:
    name: windows
    runs-on: windows-latest
    # Windows is a supported platform, so this gates a release like every other
    # job. It used to be `continue-on-error` because the plan called Windows
    # "build it, do not gate on it" — ADR-0047 revisits that. A job whose
    # failure nobody has to act on is a job that tells you nothing.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build release binary
        run: cargo build --release --bin scope

      - uses: actions/upload-artifact@v7
        with:
          name: periscope-windows
          path: target/release/scope.exe
          if-no-files-found: error

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The range below needs the history either end of it.
          fetch-depth: 0

      # Only the commits this event actually added. The convention started at
      # ADR-0048 and everything before it predates the rule, so validating the
      # whole history would fail on work that was correct when it was written.
      - name: Check the messages
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
              ;;
            *)
              before="${{ github.event.before }}"
              # All zeros on a branch's first push, and a force-push can leave
              # a ref that is no longer reachable. Either way, judge the tip.
              if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                range="${{ github.sha }}~1..${{ github.sha }}"
              else
                range="$before..${{ github.sha }}"
              fi
              ;;
          esac

          echo "checking $range"
          failed=0
          for sha in $(git rev-list --no-merges "$range"); do
            if ! git log -1 --format=%B "$sha" | tools/commit-lint; then
              echo "  ...in $(git log -1 --format='%h' "$sha")" >&2
              failed=1
            fi
          done
          exit "$failed"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because a credential removed in the last commit
          # is still in the repository. This is only worth asking for because
          # the scan below actually reads it — see the note there.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # RUSTSEC advisories against the exact versions in Cargo.lock. This is the
      # check that notices a dependency became vulnerable while nobody touched
      # this repository.
      # Vulnerabilities fail the build. Unmaintained-crate warnings do not:
      # every one of them arrives through GPUI or kube and cannot be fixed
      # here, so they are listed with their reasons in `.cargo/audit.toml`
      # rather than silenced — a new one still shows up as a failure.
      - name: Known vulnerabilities
        run: cargo audit

      # Licences, duplicate versions and unmaintained crates. Kept separate from
      # `audit` so a licence question never masks a vulnerability.
      - name: Dependency policy
        run: cargo deny check

      # The invariants that no type can express: what is written to a log, an
      # audit entry, or a file. Each test names the incident it exists for.
      - name: Guardrails
        run: cargo test -p periscope-guardrails

      # The upstream Action was doing almost nothing. It scans only the pushed
      # commits — its own log read "1 commits scanned … ~10501 bytes" against a
      # 1.95 MB repository — so `fetch-depth: 0` above bought nothing and a
      # credential committed last week would never be looked at again. It is
      # also proprietary, on a licence that requires a key for organizations,
      # and it was the last thing here pinned to a deprecated Node runtime.
      #
      # The binary is MIT, pinned by version and by checksum, and scans the
      # whole history. `.gitleaks.toml` says what is allowlisted and why.
      - name: Secrets in the history
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
