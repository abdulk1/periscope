# What is acceptable to depend on.
#
# `cargo audit` answers "is anything we depend on known to be vulnerable".
# This answers the slower questions: are we shipping a licence we cannot, is a
# dependency unmaintained, and are we carrying three copies of one crate.

[advisories]
# Unmaintained crates are a warning here and a failure in `cargo audit`, so the
# two checks do not report the same thing twice.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Apache-2.0 is what this project ships under; the rest are the permissive
# licences its dependency tree already carries.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Four of the entries above are here because the graph already carries them,
# and each is permissive enough to ship under Apache-2.0. Named so that adding
# to this list stays a decision rather than a reflex:
#
# * `0BSD` — `enum-iterator` and its derive, through gpui-component. Public
#   domain in all but name; no attribution required at all.
# * `NCSA` — `libfuzzer-sys`, pulled in by `rav1e` → `ravif` → `image` → gpui,
#   for an AV1 encoder we never call. Permissive, OSI approved, and the crate
#   is `(MIT OR Apache-2.0) AND NCSA`, so the NCSA half is what needs saying.
# * `CDLA-Permissive-2.0` — `webpki-root-certs`. A *data* licence, on the
#   Mozilla root certificate list rather than on code, and permissive.
confidence-threshold = 0.9

[bans]
# Duplicates are a fact of a large graph; this is here to stop them growing
# silently rather than to forbid them today.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
